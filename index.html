<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KHẢO SÁT THỊ TRƯỜNG – Yến sào Khánh Hòa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--p-h:215;--a-h:42;--bg:#f3f5f9;--card:#fff;--tx:#18202b;--mu:#667386;--bd:#e3e8ef;--pr:hsl(var(--p-h) 78% 27%);--pr2:hsl(var(--p-h) 70% 40%);--prt:#fff;--gd:hsl(var(--a-h) 72% 46%);--soft:hsl(var(--p-h) 45% 96%);--h1:hsl(var(--p-h) 78% 22%);--h2:hsl(var(--p-h) 65% 36%);--dg:#c0392b;--ok:#1e8e5a;--sh:0 4px 18px rgba(20,40,80,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--card:#161e29;--tx:#e8edf3;--mu:#98a4b4;--bd:#263243;--pr:hsl(var(--p-h) 85% 72%);--pr2:hsl(var(--p-h) 60% 52%);--prt:#08101c;--gd:hsl(var(--a-h) 80% 58%);--soft:hsl(var(--p-h) 25% 17%);--sh:none}}
:root[data-theme="dark"]{--bg:#0e141c;--card:#161e29;--tx:#e8edf3;--mu:#98a4b4;--bd:#263243;--pr:hsl(var(--p-h) 85% 72%);--pr2:hsl(var(--p-h) 60% 52%);--prt:#08101c;--gd:hsl(var(--a-h) 80% 58%);--soft:hsl(var(--p-h) 25% 17%);--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:10px 12px 96px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:20px;padding:16px;margin:6px 0 12px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);border-bottom:5px solid var(--gd)}
.hero img{width:68px;height:68px;border-radius:50%;background:#fff;object-fit:contain;padding:3px;cursor:pointer;flex:none}
.hero h1{margin:0;font-size:20px;letter-spacing:.8px;line-height:1.2}.hero p{margin:3px 0 0;font-size:12px;opacity:.92;letter-spacing:1.4px;font-weight:700;color:hsl(var(--a-h) 90% 75%)}.hero small{display:block;opacity:.75;font-size:11px;margin-top:4px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd)}
h2{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px}h2:before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--gd),var(--pr2))}
.sub{color:var(--mu);font-size:13px;margin-bottom:8px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 5px;letter-spacing:.2px}
input,textarea,select{width:100%;padding:12px;border:1.5px solid transparent;border-radius:12px;background:var(--soft);color:var(--tx);font:inherit;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--pr2);background:var(--card)}
input[readonly]{opacity:.8}textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.p{background:linear-gradient(135deg,var(--pr2),var(--pr));color:var(--prt);border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.15)}
button.d{color:var(--dg)}button:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg{display:flex;gap:8px}.tg button{flex:1;border-radius:14px;padding:12px;border:2px solid var(--bd);background:var(--card);color:var(--mu)}
.tg button.y.on{background:var(--ok);border-color:var(--ok);color:#fff}.tg button.n.on{background:var(--dg);border-color:var(--dg);color:#fff}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative;width:92px}.th img{width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
.th small{display:block;font-size:10px;color:var(--mu);line-height:1.2}
.th b{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;cursor:pointer;font-weight:400;line-height:22px}
.it{border-top:1px solid var(--bd);padding:12px 0}.it:first-child{border-top:0}
.it button,.it .btn{padding:6px 12px;font-size:13px;margin-top:6px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);margin:0 4px 2px 0;color:var(--mu)}
.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
.msg{font-size:13px;color:var(--mu);min-height:18px;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stat div{background:var(--soft);border-radius:12px;padding:10px 2px}.stat b{display:block;font-size:20px;color:var(--pr)}.stat span{font-size:11px;color:var(--mu)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}.kpi b{font-size:26px;color:var(--pr);display:block;line-height:1.1}.kpi span{font-size:12px;color:var(--mu)}
.br{margin:10px 0}.bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.bt{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;background:linear-gradient(90deg,var(--pr2),var(--gd));border-radius:99px}
.col{display:flex;align-items:flex-end;gap:6px;height:130px}.col div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.col i{display:block;background:linear-gradient(var(--pr2),var(--pr));border-radius:6px 6px 0 0;min-height:2px;margin:2px 0}
.seg{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:8px 0}.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.ringw{display:flex;align-items:center;gap:16px}.ringw svg{flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;border:0;background:none;color:var(--mu);font-size:21px;padding:4px;flex-direction:column;gap:1px;border-radius:12px;box-shadow:none}.nav button span{font-size:11px;font-weight:700}.nav button.on{color:var(--pr)}
</style></head><body><main>
<div class="hero"><img id="logo" alt="Logo Yến sào Khánh Hòa"><div><h1>KHẢO SÁT THỊ TRƯỜNG</h1><p>YẾN SÀO KHÁNH HÒA</p><small id="hdDate"></small></div></div>
<input type="file" id="lgf" accept="image/*" hidden>

<section id="v1">
<div class="card"><h2>Đợt khảo sát</h2>
<div class="row"><div><label>Người khảo sát</label><input id="who"></div><div><label>Khu vực (Tỉnh/Thành)</label><input id="area" list="provs"><datalist id="provs"></datalist></div></div></div>

<div class="card"><h2 id="ft">Điểm bán</h2>
<label>Tên cửa hàng / Siêu thị tiện lợi / Shop / Tạp hóa *</label><input id="name">
<label>Chủ cửa hàng</label><input id="owner">
<div class="bar"><button class="p" id="gps">📍 Lấy vị trí GPS</button><a class="btn" id="mapA" target="_blank" rel="noopener">🗺️ Mở Google Maps</a></div>
<div class="msg" id="gm"></div>
<label>Thời gian khảo sát</label><input id="tm" readonly placeholder="Tự hiện sau khi lấy vị trí GPS">
<label>Địa chỉ: số nhà, đường, phường/xã (Tỉnh/Thành tự điền theo GPS)</label><input id="a1" placeholder="VD: 12 Trần Phú, Phường Lộc Thọ"><input id="a2" type="hidden"><input id="a3" type="hidden">
<label>Địa chỉ đầy đủ (tự ghép)</label><input id="addrP" readonly>
<input id="lat" type="hidden"><input id="lng" type="hidden"><input id="glink" type="hidden"></div>

<div class="card"><h2>Hiện diện Yến sào Khánh Hòa</h2>
<label>Biển hiệu Yến sào Khánh Hòa</label><select id="sign" hidden><option>Có</option><option>Không</option></select><div class="tg" data-for="sign"></div>
<label>Ghi chú biển hiệu</label><input id="signN" placeholder="Hãng, tình trạng, kích thước...">
<label>Kệ trưng bày sản phẩm Yến sào Khánh Hòa</label><select id="shelf" hidden><option>Có</option><option>Không</option></select><div class="tg" data-for="shelf"></div>
<label>Ghi chú kệ</label><input id="shelfN" placeholder="Vị trí, số tầng, tình trạng..."></div>

<div class="card"><h2>Tham gia chương trình</h2>
<label>Chương trình Tích lũy</label><select id="ctTL" hidden><option>Có</option><option>Không</option></select><div class="tg" data-for="ctTL"></div>
<label>Chương trình Trưng bày sản phẩm</label><select id="ctTB" hidden><option>Có</option><option>Không</option></select><div class="tg" data-for="ctTB"></div>
<label>Ghi chú chương trình</label><input id="progN" placeholder="Mức tích lũy, thời gian trưng bày..."></div>

<div class="card"><h2>Đối thủ & ghi chú</h2>
<label>Đối thủ cạnh tranh</label><textarea id="comp" placeholder="Hãng nào đang bán, giá, khuyến mãi..."></textarea>
<label>Ghi chú</label><textarea id="note"></textarea></div>

<div class="card"><h2>Hình ảnh hiện trường (Timemark)</h2>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<div class="bar"><button id="b1">x</button><button id="b2">x</button></div>
<div class="thumbs" id="th"></div></div>

<div class="bar" style="margin:0 0 12px"><button class="p" id="save" style="flex:1;padding:14px">💾 Lưu điểm bán</button><button id="clr">Làm mới</button></div>
<div class="msg" id="fm"></div>
</section>

<section id="v2" hidden>
<div class="card"><div class="stat" id="st"></div></div>
<div class="card"><h2>Danh sách đã khảo sát</h2><div id="list"></div>
<div class="bar"><button class="p" id="xl">⬇️ Xuất Excel (kèm ảnh)</button><button class="p" id="wd">⬇️ Xuất báo cáo Word A4</button></div>
<div class="msg" id="em">Sau khi tải về, tải file lên Google Drive của bạn để lưu trữ và chia sẻ.</div></div>
</section>

<section id="v3" hidden><div id="dashBox"></div></section>
</main>
<nav class="nav"><button class="on" data-v="v1">📝<span>Khảo sát</span></button><button data-v="v2">📋<span>Danh sách</span></button><button data-v="v3">📊<span>Dashboard</span></button></nav>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>

const $=id=>document.getElementById(id);
let recs=[],cur=[],editId=null,mem=false,dl=null;
const esc=s=>String(s==null?'':s);
/* ---- storage (IndexedDB, bộ nhớ tạm nếu không dùng được) ---- */
const DBP=new Promise(r=>{try{const q=indexedDB.open('ks',1);q.onupgradeneeded=()=>q.result.createObjectStore('r',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function dbAll(){const d=await DBP;if(!d){mem=true;return recs}return new Promise(r=>{const q=d.transaction('r').objectStore('r').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
async function dbPut(x){const d=await DBP;if(!d)return;return new Promise(r=>{const t=d.transaction('r','readwrite');t.objectStore('r').put(x);t.oncomplete=r;t.onerror=r})}
async function dbDel(id){const d=await DBP;if(!d)return;return new Promise(r=>{const t=d.transaction('r','readwrite');t.objectStore('r').delete(id);t.oncomplete=r;t.onerror=r})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
/* ---- vị trí ---- */
const mapsLink=(a,b)=>`https://www.google.com/maps?q=${a},${b}`;
function getPos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no();navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),no,{enableHighAccuracy:true,timeout:9000,maximumAge:5000})})}
function updMap(){const a=$('lat').value,b=$('lng').value,ad=addrStr();$('addrP').value=ad;
 $('mapA').href=(a&&b)?mapsLink(a,b):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ad||'cửa hàng')}
const PV=`Hà Nội,21.03,105.85;Tuyên Quang,22.82,104.98;Cao Bằng,22.67,106.26;Thái Nguyên,22.15,105.83;Tuyên Quang,21.82,105.21;Lào Cai,22.48,103.97;Điện Biên,21.39,103.02;Lai Châu,22.40,103.46;Sơn La,21.33,103.91;Lào Cai,21.72,104.90;Phú Thọ,20.82,105.34;Thái Nguyên,21.59,105.85;Lạng Sơn,21.85,106.76;Quảng Ninh,20.95,107.08;Bắc Ninh,21.27,106.19;Phú Thọ,21.32,105.40;Phú Thọ,21.31,105.60;Bắc Ninh,21.19,106.07;Hải Phòng,20.94,106.33;Hải Phòng,20.86,106.68;Hưng Yên,20.65,106.05;Hưng Yên,20.45,106.34;Ninh Bình,20.54,105.91;Ninh Bình,20.42,106.17;Ninh Bình,20.25,105.97;Thanh Hóa,19.81,105.78;Nghệ An,18.68,105.68;Nghệ An,19.30,104.90;Hà Tĩnh,18.34,105.91;Quảng Trị,17.47,106.62;Quảng Trị,16.82,107.10;Huế,16.46,107.59;Đà Nẵng,16.05,108.21;Đà Nẵng,15.57,108.47;Quảng Ngãi,15.12,108.80;Quảng Ngãi,14.35,108.00;Gia Lai,13.78,109.22;Gia Lai,13.98,108.00;Đắk Lắk,13.09,109.31;Đắk Lắk,12.67,108.04;Khánh Hòa,12.24,109.19;Khánh Hòa,11.56,108.99;Lâm Đồng,11.94,108.44;Lâm Đồng,12.00,107.69;Lâm Đồng,10.93,108.10;Đồng Nai,11.54,106.89;TP. Hồ Chí Minh,10.99,106.65;Đồng Nai,10.95,106.82;TP. Hồ Chí Minh,10.35,107.08;TP. Hồ Chí Minh,10.78,106.70;TP. Hồ Chí Minh,8.69,106.61;Tây Ninh,11.31,106.10;Tây Ninh,10.54,106.41;Đồng Tháp,10.36,106.36;Đồng Tháp,10.46,105.63;Vĩnh Long,10.24,106.38;Vĩnh Long,10.25,105.97;Vĩnh Long,9.93,106.34;Cần Thơ,10.04,105.78;Cần Thơ,9.78,105.47;Cần Thơ,9.60,105.97;An Giang,10.37,105.43;An Giang,10.01,105.08;An Giang,10.22,103.96;Cà Mau,9.29,105.72;Cà Mau,9.18,105.15`.split(';').map(s=>{const x=s.split(',');return[x[0],+x[1],+x[2]]});
const PROVS=[...new Set(PV.map(x=>x[0]))].sort((a,b)=>a.localeCompare(b,'vi'));
const h=s=>esc(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prov(a,b){let m=1e9,r='';for(const p of PV){const d=(p[1]-a)**2+((p[2]-b)*Math.cos(a*Math.PI/180))**2;if(d<m){m=d;r=p[0]}}return r}
let autoAddr='';
const fmt=d=>d.toLocaleDateString('vi-VN')+' '+d.toLocaleTimeString('vi-VN',{hour12:false});
let tick=null;
function startClock(){clearInterval(tick);const f=()=>{$('tm').value=fmt(new Date())};f();tick=setInterval(f,1000)}
function addrStr(){return [$('a1').value,$('a2').value,$('a3').value,$('area').value].map(s=>s.trim()).filter(Boolean).join(', ')}
function fillPos(p){$('lat').value=p.lat.toFixed(6);$('lng').value=p.lng.toFixed(6);const pv=prov(p.lat,p.lng);$('area').value=pv;ls('area',pv);startClock();updMap();return pv}
let _dl='';
function defLogo(){if(_dl)return _dl;const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,'#0b3a78');g.addColorStop(1,'#14589f');x.fillStyle=g;x.beginPath();x.arc(128,128,124,0,7);x.fill();x.lineWidth=6;x.strokeStyle='#e0b84a';x.beginPath();x.arc(128,128,116,0,7);x.stroke();x.lineWidth=7;x.lineCap='round';for(let i=0;i<3;i++){x.beginPath();x.ellipse(128,112+i*8,58-i*6,34-i*5,0,.15*Math.PI,.85*Math.PI);x.stroke()}x.fillStyle='#fff';x.beginPath();x.ellipse(128,92,16,22,0,0,7);x.fill();x.textAlign='center';x.font='bold 30px sans-serif';x.fillText('YẾN SÀO',128,186);x.fillStyle='#e0b84a';x.font='bold 26px sans-serif';x.fillText('KHÁNH HÒA',128,218);return _dl=c.toDataURL('image/png')}
function getLogo(){return ls('logo')||defLogo()}
function initLogo(){applyTheme();$('logo').src=getLogo();$('logo').onclick=()=>$('lgf').click();$('lgf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),k=Math.min(256/bm.width,256/bm.height),w=bm.width*k,h=bm.height*k;x.drawImage(bm,(256-w)/2,(256-h)/2,w,h);const d=c.toDataURL('image/png');ls('logo',d);$('logo').src=d;themeFrom(d)}catch(e){}}}
function initMics(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;['a1','signN','shelfN','progN','comp','note'].forEach(id=>{const el=$(id),b=document.createElement('button');b.type='button';b.textContent='🎤 Nói';b.style.cssText='margin-top:6px;padding:6px 10px;font-size:13px';let rec=null;b.onclick=()=>{if(!SR){$('fm').textContent='Trình duyệt này chưa hỗ trợ chuyển giọng nói thành chữ. Hãy bấm micro trên bàn phím điện thoại.';return}if(rec){rec.stop();return}rec=new SR();rec.lang='vi-VN';rec.interimResults=false;rec.continuous=true;rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';if(t)el.value=(el.value?el.value.trimEnd()+' ':'')+t.trim()};rec.onend=()=>{rec=null;b.textContent='🎤 Nói';b.classList.remove('p')};rec.onerror=()=>{$('fm').textContent='Không ghi âm được. Hãy cho phép quyền Micro cho trình duyệt.'};b.textContent='⏹ Dừng';b.classList.add('p');try{rec.start()}catch(e){rec=null}};el.insertAdjacentElement('afterend',b)})}
$('gps').onclick=async()=>{$('gm').textContent='Đang lấy vị trí...';try{const p=await getPos(),pv=fillPos(p);$('gm').textContent='Đã lấy vị trí (sai số ~'+Math.round(p.acc)+' m), tỉnh/thành: '+pv+' (ước tính theo tọa độ, có thể sửa). Bấm 🎤 Nói ở ô Địa chỉ để đọc số nhà, đường, phường/xã.'}catch(e){$('gm').textContent='Không lấy được GPS. Hãy bật Vị trí của điện thoại, cho phép trình duyệt truy cập vị trí, hoặc mở link Artifact trực tiếp bằng Chrome/Safari; có thể nhập tay hoặc dán link Google Maps.'}};
$('glink').oninput=()=>{const m=$('glink').value.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||$('glink').value.match(/[?&](?:q|query|ll)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/);
