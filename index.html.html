<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khảo sát thị trường</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dde3;--pr:#0b6e4f;--prt:#fff;--dg:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#e8ecef;--mu:#9aa5b1;--bd:#333b43;--pr:#3fbf8f;--prt:#06241a;--dg:#ff8a80}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2327;--tx:#e8ecef;--mu:#9aa5b1;--bd:#333b43;--pr:#3fbf8f;--prt:#06241a;--dg:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
textarea{min-height:68px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{display:inline-block;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;text-decoration:none}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button.d{color:var(--dg)}
button:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{position:relative;width:92px}.th img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.th small{display:block;font-size:10px;color:var(--mu);line-height:1.2}
.th b{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer;font-weight:400}
.it{border-top:1px solid var(--bd);padding:10px 0}.it:first-child{border-top:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);margin-right:4px}
.ok{color:var(--pr);border-color:var(--pr)}
.msg{font-size:13px;color:var(--mu);min-height:18px;margin-top:6px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stat div{background:var(--bg);border-radius:8px;padding:8px 2px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mu)}
</style></head><body><main>
<h1>Khảo sát thị trường</h1>
<div class="sub">Ghi nhận điểm bán, chụp ảnh gắn tọa độ, xuất Excel và báo cáo Word A4. Dữ liệu lưu trên thiết bị này.</div>

<div class="card"><div class="stat" id="st"></div>
<div class="row"><div><label>Người khảo sát</label><input id="who"></div><div><label>Khu vực khảo sát (tỉnh/thành, tự lấy theo GPS)</label><input id="area" list="provs"><datalist id="provs"></datalist></div></div></div>

<div class="card"><h2 id="ft">Điểm bán mới</h2>
<label>Tên cửa hàng / địa điểm *</label><input id="name">
<div class="row"><div><label>Chủ cửa hàng</label><input id="owner"></div><div><label>Số điện thoại</label><input id="phone" inputmode="tel"></div></div>
<label>Địa chỉ (GPS tự điền tỉnh + tọa độ, bạn bổ sung số nhà, đường)</label><input id="addr" placeholder="Số nhà, đường, phường, tỉnh/thành">
<div class="row"><div><label>Vĩ độ</label><input id="lat" inputmode="decimal"></div><div><label>Kinh độ</label><input id="lng" inputmode="decimal"></div></div>
<label>Hoặc dán link Google Maps</label><input id="glink" placeholder="https://maps.app.goo.gl/... hoặc link có @lat,lng">
<div class="bar"><button id="gps">📍 Lấy vị trí GPS</button><a class="btn" id="mapA" target="_blank" rel="noopener">🗺️ Mở Google Maps</a></div>
<div class="msg" id="gm"></div>
<div class="row"><div><label>Biển hiệu</label><select id="sign"><option>Có</option><option>Không</option></select></div><div><label>Ghi chú biển hiệu</label><input id="signN" placeholder="Hãng, tình trạng, kích thước..."></div></div><div class="row"><div><label>Kệ trưng bày</label><select id="shelf"><option>Có</option><option>Không</option></select></div><div><label>Ghi chú kệ</label><input id="shelfN" placeholder="Vị trí, số tầng, tình trạng..."></div></div>
<label>Đối thủ cạnh tranh</label><textarea id="comp" placeholder="Hãng nào đang bán, giá, khuyến mãi..."></textarea>
<label>Ghi chú</label><textarea id="note"></textarea>
<label>Ảnh hiện trường (tự gắn tọa độ + giờ chụp)</label>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<div class="bar"><button id="b1">📷 Chụp ảnh</button><button id="b2">🖼️ Chọn từ thư viện</button></div>
<div class="thumbs" id="th"></div>
<div class="bar"><button class="p" id="save">Lưu điểm bán</button><button id="clr">Làm mới form</button></div>
<div class="msg" id="fm"></div></div>

<div class="card"><h2>Danh sách đã khảo sát</h2><div id="list"></div>
<div class="bar"><button class="p" id="xl">⬇️ Xuất Excel (kèm ảnh)</button><button class="p" id="wd">⬇️ Xuất báo cáo Word A4</button></div>
<div class="msg" id="em">Sau khi tải về, tải file lên Google Drive của bạn để lưu trữ và chia sẻ.</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
const $=id=>document.getElementById(id);
let recs=[],cur=[],editId=null,mem=false,dl=null;
const esc=s=>String(s==null?'':s);
/* ---- storage (IndexedDB, bộ nhớ tạm nếu không dùng được) ---- */
const DBP=new Promise(r=>{try{const q=indexedDB.open('ks',1);q.onupgradeneeded=()=>q.result.createObjectStore('r',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function dbAll(){const d=await DBP;if(!d){mem=true;return recs}return new Promise(r=>{const q=d.transaction('r').objectStore('r').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
async function dbPut(x){const d=await DBP;if(!d)return;return new Promise(r=>{const t=d.transaction('r','readwrite');t.objectStore('r').put(x);t.oncomplete=r;t.onerror=r})}
async function dbDel(id){const d=await DBP;if(!d)return;return new Promise(r=>{const t=d.transaction('r','readwrite');t.objectStore('r').delete(id);t.oncomplete=r;t.onerror=r})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
/* ---- vị trí ---- */
const mapsLink=(a,b)=>`https://www.google.com/maps?q=${a},${b}`;
function getPos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no();navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),no,{enableHighAccuracy:true,timeout:9000,maximumAge:5000})})}
function updMap(){const a=$('lat').value,b=$('lng').value,ad=$('addr').value.trim();
 $('mapA').href=(a&&b)?mapsLink(a,b):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ad||'cửa hàng')}
const PV=`Hà Nội,21.03,105.85;Tuyên Quang,22.82,104.98;Cao Bằng,22.67,106.26;Thái Nguyên,22.15,105.83;Tuyên Quang,21.82,105.21;Lào Cai,22.48,103.97;Điện Biên,21.39,103.02;Lai Châu,22.40,103.46;Sơn La,21.33,103.91;Lào Cai,21.72,104.90;Phú Thọ,20.82,105.34;Thái Nguyên,21.59,105.85;Lạng Sơn,21.85,106.76;Quảng Ninh,20.95,107.08;Bắc Ninh,21.27,106.19;Phú Thọ,21.32,105.40;Phú Thọ,21.31,105.60;Bắc Ninh,21.19,106.07;Hải Phòng,20.94,106.33;Hải Phòng,20.86,106.68;Hưng Yên,20.65,106.05;Hưng Yên,20.45,106.34;Ninh Bình,20.54,105.91;Ninh Bình,20.42,106.17;Ninh Bình,20.25,105.97;Thanh Hóa,19.81,105.78;Nghệ An,18.68,105.68;Nghệ An,19.30,104.90;Hà Tĩnh,18.34,105.91;Quảng Trị,17.47,106.62;Quảng Trị,16.82,107.10;Huế,16.46,107.59;Đà Nẵng,16.05,108.21;Đà Nẵng,15.57,108.47;Quảng Ngãi,15.12,108.80;Quảng Ngãi,14.35,108.00;Gia Lai,13.78,109.22;Gia Lai,13.98,108.00;Đắk Lắk,13.09,109.31;Đắk Lắk,12.67,108.04;Khánh Hòa,12.24,109.19;Khánh Hòa,11.56,108.99;Lâm Đồng,11.94,108.44;Lâm Đồng,12.00,107.69;Lâm Đồng,10.93,108.10;Đồng Nai,11.54,106.89;TP. Hồ Chí Minh,10.99,106.65;Đồng Nai,10.95,106.82;TP. Hồ Chí Minh,10.35,107.08;TP. Hồ Chí Minh,10.78,106.70;TP. Hồ Chí Minh,8.69,106.61;Tây Ninh,11.31,106.10;Tây Ninh,10.54,106.41;Đồng Tháp,10.36,106.36;Đồng Tháp,10.46,105.63;Vĩnh Long,10.24,106.38;Vĩnh Long,10.25,105.97;Vĩnh Long,9.93,106.34;Cần Thơ,10.04,105.78;Cần Thơ,9.78,105.47;Cần Thơ,9.60,105.97;An Giang,10.37,105.43;An Giang,10.01,105.08;An Giang,10.22,103.96;Cà Mau,9.29,105.72;Cà Mau,9.18,105.15`.split(';').map(s=>{const x=s.split(',');return[x[0],+x[1],+x[2]]});
const PROVS=[...new Set(PV.map(x=>x[0]))].sort((a,b)=>a.localeCompare(b,'vi'));
const h=s=>esc(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prov(a,b){let m=1e9,r='';for(const p of PV){const d=(p[1]-a)**2+((p[2]-b)*Math.cos(a*Math.PI/180))**2;if(d<m){m=d;r=p[0]}}return r}
let autoAddr='';
function fillPos(p){$('lat').value=p.lat.toFixed(6);$('lng').value=p.lng.toFixed(6);const pv=prov(p.lat,p.lng);$('area').value=pv;ls('area',pv);const a=$('addr');if(!a.value.trim()||a.value===autoAddr){autoAddr=`${pv} (GPS ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)})`;a.value=autoAddr}updMap();return pv}
$('gps').onclick=async()=>{$('gm').textContent='Đang lấy vị trí...';try{const p=await getPos(),pv=fillPos(p);$('gm').textContent='Đã điền tọa độ (sai số ~'+Math.round(p.acc)+' m) và tỉnh/thành: '+pv+' (ước tính theo tọa độ, có thể sửa). Hãy bổ sung số nhà, đường vào ô địa chỉ.'}catch(e){$('gm').textContent='Không lấy được GPS. Hãy bật Vị trí của điện thoại, cho phép trình duyệt truy cập vị trí, hoặc mở link Artifact trực tiếp bằng Chrome/Safari; có thể nhập tay hoặc dán link Google Maps.'}};
$('glink').oninput=()=>{const m=$('glink').value.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||$('glink').value.match(/[?&](?:q|query|ll)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/);
 if(m){$('lat').value=m[1];$('lng').value=m[2];$('gm').textContent='Đã đọc tọa độ từ link.'}else if($('glink').value)$('gm').textContent='Link rút gọn không chứa tọa độ: hãy mở link, rồi dùng link dài hoặc bấm Lấy vị trí GPS.';updMap()};
['lat','lng','addr'].forEach(i=>$(i).oninput=updMap);
/* ---- ảnh ---- */
async function procPhoto(f){
 let pos=null;try{pos=await getPos()}catch(e){}
 if(pos&&!$('lat').value)fillPos(pos);if(!pos&&$('lat').value&&$('lng').value)pos={lat:+$('lat').value,lng:+$('lng').value};
 const bm=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bm.width,bm.height)),w=Math.round(bm.width*k),h=Math.round(bm.height*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(bm,0,0,w,h);
 const t=new Date().toLocaleString('vi-VN'),s1=pos?`GPS: ${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`:'GPS: không có',fs=Math.max(13,Math.round(w/42));
 x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-fs*2.6,w,fs*2.6);x.fillStyle='#fff';x.font=fs+'px sans-serif';x.fillText(s1,fs*.5,h-fs*1.5);x.fillText(t+' | '+($('name').value||'Điểm bán'),fs*.5,h-fs*.4);
 return{src:c.toDataURL('image/jpeg',.78),w,h,lat:pos?pos.lat:null,lng:pos?pos.lng:null,t}}
async function addFiles(fl){$('fm').textContent='Đang xử lý ảnh...';for(const f of fl){try{cur.push(await procPhoto(f))}catch(e){}}$('fm').textContent='';drawTh()}
$('b1').onclick=()=>$('cam').click();$('b2').onclick=()=>$('gal').click();
$('cam').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};$('gal').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
function drawTh(){$('th').innerHTML=cur.map((p,i)=>`<div class="th"><img src="${p.src}"><b data-i="${i}">×</b><small>${p.lat!=null?p.lat.toFixed(5)+', '+p.lng.toFixed(5):'không có GPS'}</small></div>`).join('');
 $('th').querySelectorAll('b').forEach(b=>b.onclick=()=>{cur.splice(+b.dataset.i,1);drawTh()})}
/* ---- lưu / danh sách ---- */
function resetForm(){editId=null;cur=[];autoAddr='';['name','owner','phone','addr','lat','lng','glink','comp','note','signN','shelfN'].forEach(i=>$(i).value='');$('sign').value='Có';$('shelf').value='Có';$('ft').textContent='Điểm bán mới';drawTh();updMap();$('gm').textContent=''}
$('clr').onclick=resetForm;
$('who').onchange=()=>ls('who',$('who').value);$('area').onchange=()=>ls('area',$('area').value);
$('save').onclick=async()=>{const n=$('name').value.trim();if(!n){$('fm').textContent='Vui lòng nhập tên cửa hàng.';return}
 const old=recs.find(r=>r.id===editId);
 const r={id:editId||('r'+Date.now()),time:old?old.time:new Date().toISOString(),name:n,owner:$('owner').value,phone:$('phone').value,addr:$('addr').value,lat:$('lat').value,lng:$('lng').value,prov:$('area').value,sign:$('sign').value,signN:$('signN').value,shelf:$('shelf').value,shelfN:$('shelfN').value,comp:$('comp').value,note:$('note').value,photos:cur};
 const i=recs.findIndex(x=>x.id===r.id);if(i>=0)recs[i]=r;else recs.push(r);await dbPut(r);resetForm();render();$('fm').textContent='Đã lưu.'};
function edit(id){const r=recs.find(x=>x.id===id);editId=id;cur=r.photos.slice();['name','owner','phone','addr','lat','lng','comp','note','signN','shelfN'].forEach(k=>$(k).value=r[k]||'');$('sign').value=r.sign;$('shelf').value=r.shelf;$('ft').textContent='Sửa: '+r.name;drawTh();updMap();scrollTo({top:0,behavior:'smooth'})}
function render(){
 const n=recs.length,a=recs.filter(r=>r.sign==='Có').length,b=recs.filter(r=>r.shelf==='Có').length,p=recs.reduce((s,r)=>s+r.photos.length,0);
 $('st').innerHTML=[[n,'Điểm bán'],[a,'Có biển hiệu'],[b,'Có kệ'],[p,'Ảnh']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
 $('list').innerHTML=n?recs.slice().reverse().map(r=>`<div class="it"><b>${h(r.name)}</b> <span class="tag ${r.sign==='Có'?'ok':''}">Biển hiệu: ${r.sign}</span><span class="tag ${r.shelf==='Có'?'ok':''}">Kệ: ${r.shelf}</span><div class="sub" style="margin:2px 0">${h(r.addr)||'(chưa có địa chỉ)'}${r.signN?' · Biển hiệu: '+h(r.signN):''}${r.shelfN?' · Kệ: '+h(r.shelfN):''} · ${r.photos.length} ảnh · ${new Date(r.time).toLocaleString('vi-VN')}</div>
 <button data-e="${r.id}">Sửa</button> ${r.lat&&r.lng?`<a class="btn" target="_blank" rel="noopener" href="${mapsLink(r.lat,r.lng)}">Bản đồ</a>`:''} <button class="d" data-d="${r.id}">Xóa</button></div>`).join(''):'<div class="sub">Chưa có điểm bán nào.</div>';
 $('list').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(b.dataset.e));
 $('list').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Bấm lần nữa để xóa';return}recs=recs.filter(r=>r.id!==b.dataset.d);await dbDel(b.dataset.d);render()})}
/* ---- xuất file ---- */
const u8=s=>Uint8Array.from(atob(s.split(',')[1]),c=>c.charCodeAt(0));
async function save(name,data){if(!dl){$('em').textContent='Môi trường này không hỗ trợ tải file.';return}try{await dl.save({filename:name,data});$('em').textContent='Đã tạo '+name+'. Hãy tải lên Google Drive để lưu trữ.'}catch(e){$('em').textContent=e&&e.code==='declined'?'Bạn đã hủy tải.':'Không tải được: '+(e&&e.message||'lỗi')}}
const stamp=()=>new Date().toISOString().slice(0,10);
$('xl').onclick=async()=>{if(!recs.length){$('em').textContent='Chưa có dữ liệu.';return}$('em').textContent='Đang tạo Excel...';
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Khảo sát');
 const H=['STT','Tên cửa hàng','Chủ cửa hàng','SĐT','Tỉnh/Thành','Địa chỉ','Vĩ độ','Kinh độ','Google Maps','Biển hiệu','Ghi chú biển hiệu','Kệ trưng bày','Ghi chú kệ','Đối thủ cạnh tranh','Ghi chú','Thời gian','Số ảnh','Ảnh 1','Ảnh 2','Ảnh 3'];
 ws.addRow(H).font={bold:true,color:{argb:'FFFFFFFF'}};ws.getRow(1).eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B6E4F'}};c.alignment={vertical:'middle',wrapText:true}});
 [5,24,18,14,16,32,11,11,14,10,22,10,22,30,30,17,8,24,24,24].forEach((w,i)=>ws.getColumn(i+1).width=w);
 recs.forEach((r,i)=>{const row=ws.addRow([i+1,r.name,r.owner,r.phone,r.prov||'',r.addr,r.lat?+r.lat:'',r.lng?+r.lng:'',r.lat&&r.lng?{text:'Mở bản đồ',hyperlink:mapsLink(r.lat,r.lng)}:'',r.sign,r.signN||'',r.shelf,r.shelfN||'',r.comp,r.note,new Date(r.time).toLocaleString('vi-VN'),r.photos.length]);
  row.alignment={vertical:'top',wrapText:true};row.height=r.photos.length?120:30;
  r.photos.slice(0,3).forEach((p,j)=>{const id=wb.addImage({base64:p.src,extension:'jpeg'});ws.addImage(id,{tl:{col:17+j+.05,row:i+1+.05},ext:{width:150,height:Math.round(150*p.h/p.w)>150?150:Math.round(150*p.h/p.w)}})})});
 ws.views=[{state:'frozen',ySplit:1,xSplit:2}];ws.autoFilter={from:'A1',to:'T1'};
 const w2=wb.addWorksheet('Tất cả ảnh');w2.addRow(['Cửa hàng','Vĩ độ','Kinh độ','Thời gian chụp','Ảnh']).font={bold:true};[24,11,11,20,45].forEach((w,i)=>w2.getColumn(i+1).width=w);
